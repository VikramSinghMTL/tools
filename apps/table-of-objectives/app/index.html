  <div class="container">
    <h1>Table of Objectives Builder HI</h1>
    
    <p><input class="form-control" placeholder="Enter name of course" value="College Teaching and Course Design"></p>
    
    <div id="app">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">General Learning Objective</th>
            <th scope="col">Specific Learning Objective</th>
            <th scope="col" width="16%">Knowledge Dimension</th>
            <th scope="col" width="14%">Cognitive Process</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="list">
          <template v-for="(glo, gloIndex) in glos">
            <tr v-for="(slo, sloIndex) in glo.slos">
              <td v-if="sloIndex === 0" :rowspan="glo.slos.length + 1">
                <div class="form-group row">
                  <input disabled v-model="glo.id" class="col-sm-2 col-form-label"></input>
                  <div class="col-sm-10">
                    <textarea v-model="glo.description" class="form-control"></textarea>
                  </div>
                </div>
              </td>
              <td>
                <div class="form-group row post">
                  <input disabled v-model="slo.id" class="col-sm-2 col-form-label handle"></input>
                  <div class="col-sm-10">
                    <textarea v-model="slo.description" class="form-control" rows="3"></textarea>
                  </div>
                </div>
              </td>
              <td>
                <select v-model="slo.knowledge" class="form-control">
                  <option></option>
                  <option value="factual" :selected="slo.knowledge === 'factual'">Factual</option>
                  <option value="conceptual" :selected="slo.knowledge === 'conceptual'">Conceptual</option>
                  <option value="procedural" :selected="slo.knowledge === 'procedural'">Procedural</option>
                  <option value="metacognitive" :selected="slo.knowledge === 'metacognitive'">Metacognitive</option>
                </select>
              </td>
              <td>
                <select v-model="slo.cognitive" class="form-control">
                  <option></option>
                  <option value="remember" :selected="slo.cognitive === 'remember'">Remember</option>
                  <option value="understand" :selected="slo.cognitive === 'understand'">Understand</option>
                  <option value="apply" :selected="slo.cognitive === 'apply'">Apply</option>
                  <option value="anaylze" :selected="slo.cognitive === 'analyze'">Analyze</option>
                  <option value="evaluate" :selected="slo.cognitive === 'evaluate'">Evaluate</option>
                  <option value="create" :selected="slo.cognitive === 'create'">Create</option>
                </select>
              </td>
              <td class="actions-cell">
                <div class="actions">
                  <button type="button" class="btn btn-primary" v-if="sloIndex > 0" v-on:click="promoteSlo(gloIndex, sloIndex)"><i class="fas fa-arrow-up"></i></button>
                  <button type="button" class="btn btn-primary" v-if="sloIndex < glo.slos.length - 1" v-on:click="demoteSlo(gloIndex, sloIndex)"><i class="fas fa-arrow-down"></i></button>
                  <button type="button" class="btn btn-danger" v-on:click="removeSlo(gloIndex, sloIndex)"><i class="fas fa-trash-alt"></i></button>
                </div>
              </td>
            </tr>
            <tr>
              <td colspan="4">
                <button type="button" class="btn btn-primary" v-on:click="addSlo(glo.id)"><i class="fas fa-plus"></i> Add SLO</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    
      <button type="button" class="btn btn-primary" v-on:click="addGlo()"><i class="fas fa-plus"></i> Add GLO</button>
      <button type="button" class="btn btn-primary" v-on:click="save()"><i class="far fa-save"></i> Save</button>
      <button type="button" class="btn btn-primary"><i class="fas fa-upload"></i><input type="file" @change="load"></button>
      <button type="button" class="btn btn-primary"><i class="fas fa-download"></i> Export</button>
      <button type="button" class="btn btn-primary"><i class="fas fa-check"></i> Verify</button>
      <hr>
      <!-- <div class="alert alert-warning" role="alert">
        1.1 Objectives should start with a verb. Your objective may be too wordy.
      </div>
      <div class="alert alert-warning" role="alert">
        1.2 "Understand" is too general for a SLO. How will one show that one understands?
      </div>

      </div>

        1.2 Please pick a value for Knowledge.
      </div>
      <div class="alert alert-warning" role="alert">
        1.3 Objectives should be one sentence.
      </div> -->
      <div class="alert alert-success" role="alert">
        Everything looks great!
      </div>
    </div> <!-- End of Vue app -->
