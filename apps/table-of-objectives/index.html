<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Table of Objectives Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap">
  <script>
    // Apply a saved light/dark choice before first paint (no flash). Without one, the theme follows the system.
    try {
      var theme = localStorage.getItem('table-of-objectives:theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme === 'dark' ? 'paper-dark' : 'paper';
      }
    } catch (e) {}
  </script>
</head>

<body class="bg-base-200 min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
